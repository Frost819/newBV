name: 功能建议
description: 为 newBV 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前置检查
      description: 请确认已完成以下检查，避免重复提交
      options:
        - label: 我已搜索过现有 issue，确认没有重复建议
          required: true
        - label: 我已确认该功能当前尚未提供
          required: true

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 描述你希望新增或改进的功能
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 该功能解决什么问题？为什么需要它？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望实现方式
      description: 可选。如果你有实现思路或交互设计，可以写在这里
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选。目前你是如何绕过这个问题的？
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可选。参考链接、截图等
    validations:
      required: false
