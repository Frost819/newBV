name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run long-press playback tests
        run: >-
          ./gradlew
          :data:testDebugUnitTest --tests '*PrefsTest.*long press*'
          :app:testDebugUnitTest --tests '*PlayerConfirmKeyHandlerTest'

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: newBV-debug-apk
          path: app/build/outputs/apk/debug/*_debug.apk
          if-no-files-found: error
